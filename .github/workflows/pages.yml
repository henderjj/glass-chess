# Checks the project and publishes it to GitHub Pages.
#
# The app is a static site with no build step: the deploy job copies only the
# runtime files (index.html, src/, shaders/) into _site/ so dev tooling, debug
# helpers and docs are never published.

name: Check and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Install dev tooling
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Syntax-check JavaScript
        run: for f in ../src/*.js ../tools/*.mjs; do node --check "$f"; done

      - name: Vendored chess.js matches the locked package
        run: diff -q node_modules/chess.js/dist/esm/chess.js ../src/vendor/chess.js

      - name: Generated game data is up to date
        run: |
          node gen-games.mjs
          git diff --exit-code -- ../src/chess-game.js

      - name: Unit tests (AI + game replay)
        run: npm test

  build:
    name: Build site
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assemble runtime files
        run: |
          mkdir _site
          cp -r index.html src shaders _site/
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
